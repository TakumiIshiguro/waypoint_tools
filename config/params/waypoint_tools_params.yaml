waypoint_tools:
  ros__parameters:
    # パスは以下の書き方が使えます（フルパス不要）:
    #   find-pkg-share 置換     … その package の share ディレクトリ基準
    #                             （書式は下の emcl2_params_path を参照）
    #   config/...             … src/waypoint_tools 基準（保存先も src）
    #   ~/...                  … ホーム展開
    #   /abs/path              … 絶対パスもそのまま可
    # 注意: このファイルは launch 置換を展開してから読むため、
    #       コメント内の「$」+「(」も展開される。存在しない package 名は書かないこと。
    # 既定値は持たない。launch で使うキーが無い・空だと起動時にエラーになる。

    # Edit target. Used only by edit.launch.py.
    #   YAML ファイル -> そのファイルを開く
    #   フォルダ       -> 中の *.yaml を数値順に並べ、
    #                     /waypoint_editor_node/next_file /prev_file で送る
    edit_waypoint_path: config/waypoints/tsudanuma
    # edit_waypoint_path: $(find-pkg-share orne_box_navigation_executor)/config/waypoints/tsudanuma

    # Send target. Used only by send.launch.py.
    #   YAML ファイルを 1 つ指定する（フォルダは不可）。
    send_waypoint_path: config/waypoints/tsudanuma/0.yaml
    # send_waypoint_path: $(find-pkg-share orne_box_navigation_executor)/config/waypoints/tsudanuma/0.yaml

    # Map and RViz files used by the edit / record launch.
    # map_yaml_path は edit_start_map / localization が true のときだけ必要。
    map_yaml_path: ~/tsukuba0926.yaml
    # map_yaml_path: $(find-pkg-share orne_box_navigation_executor)/config/maps/tsudanuma/tsudanuma_keepout.yaml
    rviz_config_path: config/rviz/waypoint_tools.rviz

    # emcl2 params used by record.launch.py when localization is true.
    # emcl2 パッケージ既定を使うなら find-pkg-share で emcl2/config/emcl2.param.yaml を指す。
    emcl2_params_path: $(find-pkg-share orne_box_navigation_executor)/config/params/nav2_params.yaml

    # edit.launch.py で map_server を起動して既存マップを表示するか。
    edit_start_map: true

    # Common ROS settings.
    frame_id: map
    use_sim_time: false

    # Send launch options.
    send_on_start: true
    # 通過点では、この距離 [m] まで近づいたら次の waypoint を送り、止まらずに走る。
    # Nav2 の goal_checker の xy_goal_tolerance より大きくすること。
    # stop: true の点と各 YAML の最後の点は、Nav2 の到達判定まで走って停止する。
    switch_radius: 2.5
    # 失敗した waypoint を再送する回数。
    max_retries: 2
    # true: 再送しても失敗したら次の waypoint へ進む / false: 停止して next_wp を待つ。
    skip_on_failure: false

    # ---- Auto waypoint recorder. Used only by record.launch.py. ----
    # Recorded waypoints are saved to this single YAML file (overwritten on save).
    # record_waypoint_path: $(find-pkg-share orne_box_navigation_executor)/config/waypoints/tsudanuma/recorded.yaml
    record_waypoint_path: config/waypoints/tsudanuma/recorded.yaml

    # true: 既存地図（map_yaml_path）上で emcl2 により自己位置推定しながら記録する
    #       （map_server + emcl2 をこの launch で起動）。
    #       RViz の 2D Pose Estimate で初期位置を与えるまでは打点しない。
    # false: SLAM などが別途 map -> base_link を出している前提で記録する。
    localization: true

    # TF frames polled while driving (frame_id -> robot_frame).
    # sender の switch_radius 判定でも使う。
    robot_frame: base_link

    # Drop a new waypoint after moving this far [m] ...
    distance_interval: 5.0
    # ... or after the heading changes this much [deg].
    yaw_interval_deg: 30.0
    # Suppress automatic waypoints below this distance, even when turning [m].
    min_move: 5.0
